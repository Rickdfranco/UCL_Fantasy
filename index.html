<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13235B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fantasy Group</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1 id="league-name">Fantasy Group</h1>
        <p id="updated" class="meta">Loading…</p>
      </div>
      <button id="refresh" class="icon-btn" aria-label="Refresh scores">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="table" aria-selected="true">Table</button>
      <button role="tab" data-tab="matchday" aria-selected="false">Matchday</button>
      <button role="tab" data-tab="season" aria-selected="false">Season</button>
    </nav>
    <div id="md-picker" class="md-picker" aria-label="Choose matchday"></div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view" aria-live="polite"></main>

  <script src="/app.js"></script>
</body>
</html>
